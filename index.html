<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 🌻</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- PANTALLA INICIAL -->
        <section class="inicio" id="inicio">
            <p class="pequeno">Tengo algo preparado para ti...</p>
            <h1>🌻</h1>
            <h2>Un pequeño detalle</h2>
            <p class="subtitulo">Toca el botón para descubrirlo</p>
            <button id="boton">Abrir regalo 💛</button>
        </section>

        <!-- ESCENA DEL JARDÍN / JARDÍN INTERACTIVO -->
        <section class="jardin" id="jardin">

            <div class="luna"></div>
            <div class="estrellas"></div>

            <!-- REPRODUCTOR DE MÚSICA ("Chachachá" - Josean Log) Y BOTÓN FLOTANTE -->
            <audio id="musicaFondo" loop preload="auto">
                <source src="https://raw.githubusercontent.com/davidrodriguez20/flores-amarillas/main/chachacha.mp3" type="audio/mpeg">
            </audio>

            <button class="btn-musica" id="btnMusica" title="Pausar/Reproducir música">🎵</button>

            <!-- CONTENEDOR DE PÉTALOS FLOTANTES -->
            <div class="petalos-container" id="petalosContainer"></div>

            <div class="instruccion" id="instruccion">
                <p>Toca las notas o interactúa con las mariposas 🦋✨</p>
            </div>

            <!-- AVISO DE DESBLOQUEO -->
            <div class="aviso-desbloqueo" id="avisoDesbloqueo">
                ✨ ¡Has descubierto el mensaje secreto! ✨
            </div>

            <!-- BOTONES/RAMOS SUSPENDIDOS (Cartas) -->
            <div class="ramos-container">
                <div class="ramo" data-mensaje="1">
                    <span class="emoji-ramo">💐</span>
                    <span class="etiqueta">Nota 1</span>
                </div>
                <div class="ramo" data-mensaje="2">
                    <span class="emoji-ramo">🌻</span>
                    <span class="etiqueta">Nota 2</span>
                </div>
                <div class="ramo" data-mensaje="3">
                    <span class="emoji-ramo">💐</span>
                    <span class="etiqueta">Nota 3</span>
                </div>
                <!-- RAMO SECRETO (Oculto al inicio) -->
                <div class="ramo ramo-secreto" id="ramoSecreto" data-mensaje="secreto" style="display: none;">
                    <span class="emoji-ramo">👑</span>
                    <span class="etiqueta especial">Secreto 💛</span>
                </div>
            </div>

            <!-- CONTENEDOR DE FLORES DINÁMICAS (SVG) -->
            <div class="flores-campo">
                <svg viewBox="0 0 1000 600" class="svg-campo" id="svgCampo" preserveAspectRatio="xMidYMax slice">
                    <path d="M 0,550 Q 250,520 500,550 T 1000,530 L 1000,600 L 0,600 Z" fill="#1b4332" />
                    <g id="grupoFlores"></g>
                </svg>
            </div>

            <!-- MARIPOSAS INTERACTIVAS -->
            <div class="mariposa-interactiva" id="mariposa1" title="¡Tócame!">🦋</div>
            <div class="mariposa-interactiva" id="mariposa2" title="¡Tócame!">🦋</div>
            <div class="mariposa-interactiva" id="mariposa3" title="¡Tócame!">🦋</div>

        </section>

        <!-- MODAL DE CARTA CON MENSAJE -->
        <div class="modal-carta" id="modalCarta">
            <div class="carta-contenido">
                <button class="cerrar-btn" id="cerrarCarta">&times;</button>
                <div class="icono-carta">✉️</div>
                <h3 id="cartaTitulo">Un detalle especial</h3>
                <p id="cartaTexto">Cargando mensaje...</p>
                <span class="corazon-final">💛</span>
            </div>
        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
